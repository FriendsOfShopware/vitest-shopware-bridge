name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm pack --dry-run

  integration:
    strategy:
      matrix:
        include:
          - shopware: '6.6'
            ref: v6.6.10.23
          - shopware: '6.7'
            ref: v6.7.13.1
          - shopware: 'trunk'
            ref: trunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: shopware/administration
          ref: ${{ matrix.ref }}
          path: .shopware/administration
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .shopware/administration/Resources/app/administration/package-lock.json
      - run: npm ci
      - name: Install Shopware Administration dependencies
        working-directory: .shopware/administration/Resources/app/administration
        run: npm ci --ignore-scripts
      - run: npm run test:integration
        env:
          SHOPWARE_ADMINISTRATION_PATH: ${{ github.workspace }}/.shopware/administration/Resources/app/administration
