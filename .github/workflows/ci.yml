name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install bridge dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

      - name: Inspect package tarball
        run: npm pack --dry-run

  integration:
    strategy:
      matrix:
        include:
          - shopware: '6.6'
            ref: v6.6.10.23
          - shopware: '6.7'
            ref: v6.7.13.1
          - shopware: 'trunk'
            ref: trunk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v7

      - name: Checkout Shopware Administration ${{ matrix.shopware }}
        uses: actions/checkout@v7
        with:
          repository: shopware/administration
          ref: ${{ matrix.ref }}
          path: .shopware/administration

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .shopware/administration/Resources/app/administration/package-lock.json

      - name: Install bridge dependencies
        run: npm ci

      - name: Install Shopware Administration dependencies
        working-directory: .shopware/administration/Resources/app/administration
        run: npm ci --ignore-scripts

      - name: Run integration tests
        run: npm run test:integration
        env:
          SHOPWARE_ADMINISTRATION_PATH: ${{ github.workspace }}/.shopware/administration/Resources/app/administration
